app:
  name: "AI Customer Support Intelligence Platform"
  version: "1.0.0"
  environment: "development"
  log_level: "INFO"

database:
  url: "sqlite:///./artifacts/support_intelligence.db"
  echo_sql: false

nlp:
  lowercase: true
  strip_html: true
  remove_special_chars: false
  remove_stopwords: false
  lemmatize: false

models:
  default_classifier: "classical"
  intent_classes:
    - account_access
    - billing_and_payments
    - cancellation_and_refund
    - order_tracking
    - technical_support
    - general_inquiry
  urgency_levels: [low, medium, high, critical]
  classical:
    model_type: "logistic_regression"
    max_features: 10000
    ngram_range: [1, 2]
    min_df: 1
    max_df: 0.98
    c_regularization: 1.0
    artifact_path: "models/tfidf/classical_pipeline.joblib"
  transformer:
    model_name: "distilbert-base-uncased"
    max_length: 128
    batch_size: 8
    learning_rate: 0.00002
    epochs: 3
    weight_decay: 0.01
    warmup_ratio: 0.1
    patience: 2
    artifact_path: "models/bert/intent_classifier"

sentiment:
  model_name: "cardiffnlp/twitter-roberta-base-sentiment-latest"

rag:
  knowledge_base_dir: "data/knowledge_base"
  chunk_size: 800
  chunk_overlap: 120
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  top_k: 3
  similarity_threshold: 0.55
  index_path: "models/embeddings/faiss.index"
  metadata_path: "models/embeddings/metadata.json"

llm:
  provider: "mock"
  model_name: "gemini-2.5-flash"
  temperature: 0.2
  max_output_tokens: 512
  mock_responses_in_test: true

intelligence:
  confidence_threshold: 0.60
  high_priority_sentiments: [negative]
  financial_intents: [billing_and_payments, cancellation_and_refund]
  critical_intents: [account_access, technical_support]
  escalation_similarity_threshold: 0.55

api:
  host: "0.0.0.0"
  port: 8000

dashboard:
  port: 8501
